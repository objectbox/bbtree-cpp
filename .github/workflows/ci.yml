# The port's CI, after the Rust crate's ci.yml, sanitizer.yml, shuttle.yml and
# fuzz.yml (PORTING.md, P1): format, Clang and GCC builds with tests, the
# tests under AddressSanitizer + UBSan and under ThreadSanitizer (the Shuttle
# tests' stand-in), each fuzz target for a minute, and the bench's self-check.
# Ubuntu 24.04 ships the versions the port is developed with: Clang and
# clang-format 15, GCC 13, CMake 3.28.
name: test

# Every pushed branch runs, so that work in progress is checked before it
# reaches main; pull requests run too.
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  check:
    name: format + Clang + GCC + tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang-15 clang-format-15 g++-13 ninja-build ccache
      - name: Use Clang 15
        run: scripts/use-clang-15.sh clang clang++ clang-format
      - name: Format, build and test
        run: scripts/check.sh

  sanitizers:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, tsan]
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y clang-15 ninja-build ccache
          scripts/use-clang-15.sh clang clang++
      # ThreadSanitizer needs the address space layout it was built for.
      - name: Fix the address space layout for TSan
        if: matrix.preset == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}

  fuzz:
    name: fuzz (a minute a target)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y clang-15 libclang-rt-15-dev ninja-build ccache
          scripts/use-clang-15.sh clang clang++
      - run: cmake --preset fuzz
      - run: cmake --build --preset fuzz
      - name: Run every target
        run: |
          for target in build/fuzz/bbtree/fuzz/fuzz_*; do
            mkdir -p "corpus/$(basename "$target")"
            "$target" "corpus/$(basename "$target")" -max_total_time=60
          done

  bench:
    name: bench builds and checks its inputs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y clang-15 ninja-build ccache
          scripts/use-clang-15.sh clang clang++
      - run: cmake --preset bench
      - run: cmake --build --preset bench
      - run: build/bench/bbtree/bench/bbtree-bench self-check
      - run: build/bench/bbtree/bench/bbtree-bench ci --quick
